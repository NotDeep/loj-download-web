# Put this inside your existing server block when you want
# the downloader to live under the same host and port.
#
# Required app env:
#   PORT=18730
#   APP_BASE_PATH=/loj-download
#
# Then add the following location rules to your existing nginx server {}:

location = /loj-download {
    return 302 /loj-download/;
}

location /loj-download/ {
    proxy_pass http://127.0.0.1:18730/loj-download/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
}
